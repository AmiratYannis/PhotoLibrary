<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#3A4FC9"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD9A8"/>
      <stop offset="1" stop-color="#FF9E7A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#10194D" flood-opacity="0.35"/>
    </filter>
    <clipPath id="photo">
      <rect x="146" y="176" width="236" height="176" rx="14"/>
    </clipPath>
  </defs>

  <!-- App tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>

  <!-- Back photo -->
  <g filter="url(#shadow)" transform="rotate(-12 256 256)">
    <rect x="122" y="140" width="268" height="232" rx="22" fill="#E8EEFF"/>
    <rect x="138" y="156" width="236" height="176" rx="14" fill="#9DB4F5"/>
  </g>

  <!-- Middle photo -->
  <g filter="url(#shadow)" transform="rotate(7 256 256)">
    <rect x="122" y="140" width="268" height="232" rx="22" fill="#F4F7FF"/>
    <rect x="138" y="156" width="236" height="176" rx="14" fill="#7FD3C4"/>
  </g>

  <!-- Front photo -->
  <g filter="url(#shadow)">
    <rect x="130" y="160" width="268" height="232" rx="22" fill="#FFFFFF"/>
    <g clip-path="url(#photo)">
      <rect x="146" y="176" width="236" height="176" fill="url(#sky)"/>
      <circle cx="322" cy="226" r="24" fill="#FFF4D6"/>
      <path d="M146 352 L222 262 L268 312 L300 280 L382 352 Z" fill="#2F6B5E"/>
      <path d="M146 352 L222 262 L246 290 L196 352 Z" fill="#3E8A78"/>
      <path d="M268 312 L300 280 L382 352 L330 352 Z" fill="#245548"/>
    </g>
  </g>
</svg>
